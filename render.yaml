services:
  - type: web
    name: sqlbuddy
    runtime: docker
    plan: 0.5c-512mb
    dockerfilePath: ./agents/sqlbuddy/Dockerfile
    dockerContext: ./agents/sqlbuddy
    healthCheckPath: /api/v1/health
    disk:
      name: sqlbuddy-history
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: SQLBUDDY_ACCESS_PASSWORD
        sync: false
      - key: SQLBUDDY_REQUIRE_ACCESS_PASSWORD
        value: "true"
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: SQLBUDDY_DATABASE_PATH
        value: /app/data/sqlbuddy.db
      - key: SQLBUDDY_FRONTEND_ORIGIN
        value: ""
      - key: SQLBUDDY_RATE_LIMIT_REQUESTS
        value: "20"
      - key: SQLBUDDY_RATE_LIMIT_WINDOW_SECONDS
        value: "60"
      - key: SQLBUDDY_REQUEST_TIMEOUT_SECONDS
        value: "120"
